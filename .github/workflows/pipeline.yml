name: Cucumber Tests with Allure Report

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd UI_Testing
          npm install
          npm install -g allure-commandline

      - name: Run UI tests
        run: |
          cd UI_Testing
          npm run test:login || true;
          npm run test:contact_empty || true;
          npm run test:contact_with_data || true;
          npm run test:contact_clear_fields || true;
          npm run test:delete_product || true;
          npm run test:cart || true;
          npm run test:cart2 || true;
          npm run test:checkout || true;
          npm run test:signup || true;
          npm run test:about || true;
          npm run test:logout || true;

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ui-allure-results
          path: UI_Testing/allure-results
          retention-days: 30

  api-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd API_Testing
          npm install
          npm install -g allure-commandline

      - name: Start JAR application
        run: |
          cd API_Testing
          nohup java -jar ./demo-0.0.1-SNAPSHOT.jar &
          sleep 30

      - name: Run API tests
        run: |
          cd API_Testing
          npm test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-allure-results
          path: API_Testing/allure-results
          retention-days: 30

  generate-report:
    needs: [ui-tests, api-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v3

      - name: Download UI Test Results
        uses: actions/download-artifact@v3
        with:
          name: ui-allure-results
          path: ui-results

      - name: Download API Test Results
        uses: actions/download-artifact@v3
        with:
          name: api-allure-results
          path: api-results

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate Combined Report
        run: |
          mkdir -p combined-results
          cp -r ui-results/* combined-results/ || true
          cp -r api-results/* combined-results/ || true
          allure generate combined-results -o allure-report --clean

      - name: Upload Combined Report
        uses: actions/upload-artifact@v3
        with:
          name: complete-test-report
          path: allure-report
          retention-days: 30